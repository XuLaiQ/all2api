# Local development topology: Go API + Doubao browser worker + media worker +
# Vite dev server. Values come from ./.env (see .env.example).
x-go-image: &go-image
  build:
    context: .
    dockerfile: Dockerfile

services:
  api:
    <<: *go-image
    ports:
      - "${API_PORT:-8888}:8888"
    environment:
      A2A_HOST: 0.0.0.0
      A2A_PORT: "8888"
      A2A_ENV: ${A2A_ENV:-development}
      A2A_DB_PATH: /app/data/all2api.db
      A2A_STATE_PATH: /app/data/gateway/state.json
      A2A_LOG_RETENTION_DAYS: ${A2A_LOG_RETENTION_DAYS:-30}
      A2A_USAGE_RETENTION_DAYS: ${A2A_USAGE_RETENTION_DAYS:-365}
      A2A_PROVISION_SESSION_TTL_SECONDS: ${A2A_PROVISION_SESSION_TTL_SECONDS:-600}
      A2A_SESSION_SECRET: ${A2A_SESSION_SECRET:-dev-only-change-me}
      A2A_CREDENTIAL_MASTER_KEY: ${A2A_CREDENTIAL_MASTER_KEY:-}
      A2A_ADMIN_USERNAME: ${A2A_ADMIN_USERNAME:-admin}
      A2A_ADMIN_PASSWORD: ${A2A_ADMIN_PASSWORD:-}
      A2A_ALLOW_WEAK_ADMIN_PASSWORD: ${A2A_ALLOW_WEAK_ADMIN_PASSWORD:-false}
      A2A_ADMIN_TOKEN: ${A2A_ADMIN_TOKEN:-}
      A2A_BOOTSTRAP_API_KEY: ${A2A_BOOTSTRAP_API_KEY:-}
      A2A_BOOTSTRAP_RPM: ${A2A_BOOTSTRAP_RPM:-60}
      A2A_TRUST_PROXY: ${A2A_TRUST_PROXY:-true}
      A2A_TRUSTED_PROXIES: ${A2A_TRUSTED_PROXIES:-127.0.0.1,::1}
      A2A_CORS_ORIGINS: http://localhost:${WEB_PORT:-5555},http://127.0.0.1:${WEB_PORT:-5555}
      A2A_WB_PLATFORM_BASE: ${A2A_WB_PLATFORM_BASE:-https://copilot.tencent.com}
      A2A_DOUBAO_PLATFORM_BASE: ${A2A_DOUBAO_PLATFORM_BASE:-https://www.doubao.com}
      A2A_CHATGPT_PLATFORM_BASE: ${A2A_CHATGPT_PLATFORM_BASE:-https://auth.openai.com}
      A2A_CHATGPT_WEB_BASE: ${A2A_CHATGPT_WEB_BASE:-https://chatgpt.com}
      A2A_CHATGPT_PROXY: ${A2A_CHATGPT_PROXY:-}
      A2A_GROK_PLATFORM_BASE: ${A2A_GROK_PLATFORM_BASE:-https://grok.com}
      A2A_GROK_BUILD_BASE: ${A2A_GROK_BUILD_BASE:-https://cli-chat-proxy.grok.com/v1}
      A2A_DOUBAO_BROWSER_ENABLED: ${A2A_DOUBAO_BROWSER_ENABLED:-false}
      A2A_DOUBAO_BROWSER_WORKER_BASE: ${A2A_DOUBAO_BROWSER_WORKER_BASE:-http://browser-worker:8891}
      A2A_DOUBAO_BROWSER_WORKER_TOKEN: ${A2A_DOUBAO_BROWSER_WORKER_TOKEN:-}
    volumes:
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/admin/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  browser-worker:
    <<: *go-image
    entrypoint: ["/usr/local/bin/doubao-browser-worker"]
    environment:
      A2A_DOUBAO_BROWSER_WORKER_PORT: "8891"
      A2A_DOUBAO_BROWSER_ENABLED: ${A2A_DOUBAO_BROWSER_ENABLED:-false}
      A2A_DOUBAO_PLATFORM_BASE: ${A2A_DOUBAO_PLATFORM_BASE:-https://www.doubao.com}
      A2A_DOUBAO_PROFILE_ROOT: /app/data/doubao/profiles
      A2A_DOUBAO_BROWSER_EXECUTABLE: ${A2A_DOUBAO_BROWSER_EXECUTABLE:-}
      A2A_DOUBAO_BROWSER_HEADLESS: ${A2A_DOUBAO_BROWSER_HEADLESS:-true}
      A2A_DOUBAO_BROWSER_WORKER_TOKEN: ${A2A_DOUBAO_BROWSER_WORKER_TOKEN:-}
    volumes:
      - browser_data:/app/data
    expose:
      - "8891"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8891/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  media-worker:
    <<: *go-image
    entrypoint: ["/usr/local/bin/media-worker"]
    environment:
      A2A_MEDIA_WORKER_PORT: "8892"
      A2A_MEDIA_WORKER_ROOT: /app/data/media-worker
      A2A_MEDIA_WORKER_TOKEN: ${A2A_MEDIA_WORKER_TOKEN:-}
    volumes:
      - media_worker_data:/app/data
    expose:
      - "8892"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8892/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: node:24-bookworm-slim
    working_dir: /workspace/web
    command: >-
      sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5555"
    ports:
      - "${WEB_PORT:-5555}:5555"
    environment:
      VITE_PROXY_TARGET: http://api:8888
    volumes:
      - ./web:/workspace/web
      - web_node_modules:/workspace/web/node_modules
    init: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
  browser_data:
  media_worker_data:
  web_node_modules:
